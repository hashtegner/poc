<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" type="module"></script>
    <title>Document</title>

    <script type="module">
    import { ByUnicoSDK } from './script.js';

    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const processId = params.get('processId');

    ByUnicoSDK.init({ token });

    ByUnicoSDK.open({
      transactionId: processId,
      token,
      onFinish: ({ transaction, type }) => {
        console.log('Transaction finished', transaction, type);
      },
      // Optional: only needed if your app shows UI that could overlap the widget.
      onWidgetVisibilityChange: (visible) => {
        // suppress or restore your modal based on widget visibility
      },
});

</script>
  </head>
  <body>

  </body>
</html>
